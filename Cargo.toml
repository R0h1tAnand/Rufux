[package]
name = "rufux"
version = "0.1.0"
edition = "2021"
authors = ["Rohit Anand"]
description = "Rufux: The Reliable USB Formatting Utility for Linux (Rufus Linux Port in Rust)"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/R0h1tAnand/Rufux"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
crossbeam-channel = "0.5"
nix = { version = "0.29", features = ["fs", "user"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tempfile = "3.20"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
